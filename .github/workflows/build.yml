name: Build

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pipeline tests
        working-directory: tools
        run: python -m unittest discover -q

  hemtt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arma-actions/hemtt@v1
      - name: Build
        run: hemtt build
      - uses: actions/upload-artifact@v4
        with:
          name: a3bal
          path: .hemttout/build
